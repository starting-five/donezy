# docker/nginx/nginx.conf

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name donezy.net www.donezy.net;

    # For Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect everything else to https
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name donezy.net www.donezy.net;

    ssl_certificate /etc/letsencrypt/live/donezy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donezy.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Add other SSL hardening headers as you like

    # Serve static React app
    root /usr/share/nginx/html;
    index index.html;

    # Let HTML5 pushState work — serve index.html for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy GraphQL (adjust path if different)
    location /graphql {
        proxy_pass http://server:4000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CORS preflight (optional, you can handle in server)
    location / {
        # static content
    }
}
