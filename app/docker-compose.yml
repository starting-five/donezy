version: "3.8"
services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: donezy_server
    restart: always
      # add other env vars / secrets here
    expose:
      - "4000"
    networks:
      - donezy_net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: donezy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # if using certbot on host, mount letsencrypt dir:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Optional: serve certbot challenge dir
      - /var/www/letsencrypt:/var/www/letsencrypt
    depends_on:
      - server
    networks:
      - donezy_net

networks:
  donezy_net:
    driver: bridge
