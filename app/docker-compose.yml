version: "3.8"
services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: donezy_server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGO_URI=mongodb+srv://test:test123@cluster0.x3jbkt7.mongodb.net/donezy_dev
      - AUTH0_DOMAIN=dev-wxhqloss2kgzeq53.us.auth0.com
      - AUTH0_AUDIENCE=https://dev-wxhqloss2kgzeq53.us.auth0.com/api/v2/
      # add other env vars / secrets here
    expose:
      - "4000"
    networks:
      - donezy_net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: donezy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # if using certbot on host, mount letsencrypt dir:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Optional: serve certbot challenge dir
      - /var/www/letsencrypt:/var/www/letsencrypt
    depends_on:
      - server
    networks:
      - donezy_net

networks:
  donezy_net:
    driver: bridge
